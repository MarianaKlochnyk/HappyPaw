  <ion-card-header>
    <div>
      <img src="assets/logo.png" alt="logo" class="logo-icon">
    </div>
  </ion-card-header>

        </div>
      </div>
      <div class="container2">
        <div class="line"></div>
        <p class="unread-notifications">{{ notificationsCount }} notifications</p>
      </div>
    </div>
  </ion-card-header>

  <ion-list>
    <ion-item lines="none" *ngFor="let item of filteredNotifications">
      <div class="notififcation-card ">
        <div class="notification-header">
          <ion-avatar slot="start">
            <div class="box">
              <img [src]="getIconPath(item.type)" alt="{{ item.type }} icon" />
            </div>              
          </ion-avatar>
          <ion-label>
           <p class="notification-title">{{ item.title }}</p>
           <p class="notification-text">{{ item.text }}</p>
          </ion-label>
        </div>
        <div class="notification-footer">
          <div slot="end" class="check-icon">
            <ng-container *ngIf="item.readStatus; else single">
              <img src="assets/read.svg" alt="Read" />
            </ng-container>
            <ng-template #single>
              <img src="assets/unread.svg" alt="Unread" />
            </ng-template>
          </div>
           <span class="date">{{ item.date }}</span>
           <span class="time">{{ item.time }}</span> 
        </div> 
      </div>
    </ion-item>
  </ion-list>
</ion-content>
